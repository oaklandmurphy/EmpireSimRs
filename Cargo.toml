[package]
name = "empiresim"
version = "0.1.0"
edition = "2021"
description = "Modeling the rise and fall of power structures and societies"
license = "CC0-1.0"

[features]
default = ["gui"]
gui = ["dep:macroquad"]

[dependencies]
rand = "0.8"
rand_distr = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
macroquad = { version = "0.4", default-features = false, optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
